# Keep the prompt shape close to the previous Powerlevel10k setup: context on
# the first line, a compact input character on the second, and secondary state
# aligned to the right.
format = """
$directory\
$git_branch\
$git_status\
$fill\
$status\
$cmd_duration\
$jobs\
$python\
$nodejs\
$golang\
$rust\
$terraform\
$aws\
$kubernetes\
$username\
$hostname\
$time\
$line_break\
$character"""

add_newline = true
command_timeout = 500
scan_timeout = 30

[directory]
style = "bold cyan"
truncation_length = 5
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
format = "[$branch(:$remote_branch)]($style) "
style = "bold green"
symbol = ""
truncation_length = 32

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
conflicted = "~${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇣${behind_count}⇡${ahead_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[fill]
symbol = " "

[status]
disabled = false
format = "[$symbol$status]($style) "
map_symbol = false
pipestatus = true
symbol = "✘"

[cmd_duration]
format = "[$duration]($style) "
min_time = 3000
show_milliseconds = false
style = "bright-black"

[jobs]
format = "[$symbol$number]($style) "
number_threshold = 1
symbol = "✦"
symbol_threshold = 1

[python]
format = "[${symbol}${pyenv_prefix}(${version})( \\($virtualenv\\))]($style) "
symbol = " "

[nodejs]
format = "[$symbol($version)]($style) "
symbol = " "

[golang]
format = "[$symbol($version)]($style) "
symbol = " "

[rust]
format = "[$symbol($version)]($style) "
symbol = " "

[terraform]
format = "[$symbol$workspace]($style) "
symbol = "󱁢 "

[aws]
format = "[$symbol$profile( $region)]($style) "
symbol = " "

[kubernetes]
disabled = false
format = "[$symbol$context( \\($namespace\\))]($style) "
symbol = "󱃾 "

[username]
format = "[$user]($style)"
show_always = false

[hostname]
format = "[@$hostname]($style) "
ssh_only = true

[time]
disabled = false
format = "[$time]($style)"
style = "dimmed cyan"
time_format = "%H:%M:%S"

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold green)"
vimcmd_symbol = "[❮](bold green)"
